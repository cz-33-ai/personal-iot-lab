esphome:
  name: esp32c3-mqtt-node
  friendly_name: ESP32 C3 MQTT Node

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  topic_prefix: esp32c3
  on_message:
    - topic: esp32c3/command
      then:
        - logger.log:
            format: "Received MQTT command: %s"
            args:
              - !lambda |-
                  x.c_str()

interval:
  - interval: 5s
    then:
      - mqtt.publish:
          topic: esp32c3/heartbeat
          payload: Hello from ESP32-C3
          qos: 0
          retain: false

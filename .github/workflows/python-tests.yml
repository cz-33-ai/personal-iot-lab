name: Python demo tests

on:
  push:
    paths:
      - "examples/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "examples/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  offline-simulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Exercise offline demo
        run: |
          python examples/prepare_for_sleep_simulator.py
          python examples/prepare_for_sleep_simulator.py --apply --scenario offline
